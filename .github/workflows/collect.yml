name: Збір даних з Telegram

on:
  schedule:
    - cron: "*/5 * * * *"      # кожні 5 хв (GitHub може запускати із затримкою)
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуску

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Гілка з даними
        uses: actions/checkout@v4
        with:
          ref: data
          path: databranch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Збір
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python collector.py --data databranch

      - name: Зберегти дані
        working-directory: databranch
        run: |
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -q -m "Дані: $(TZ=Europe/Kyiv date '+%d.%m.%Y %H:%M')"
          git push -q

      - name: Підтримка розкладу активним
        # GitHub вимикає розклад у репозиторії, де 60 днів не було комітів у main
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((40*86400)) ]; then
            git config user.name "rating-bot"
            git config user.email "rating-bot@users.noreply.github.com"
            git commit -q --allow-empty -m "Підтримка розкладу"
            git push -q
          fi
