name: Публікація на Firebase (коротка адреса)

on:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "manifest.webmanifest", "*.png", "firebase.json", ".github/workflows/firebase.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Перевірка ключа
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Секрет FIREBASE_SERVICE_ACCOUNT ще не додано — пропускаю"; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; fi
          echo "ok=1" >> $GITHUB_OUTPUT
          echo "project=$(echo "$SA" | jq -r .project_id)" >> $GITHUB_OUTPUT

      - name: Файли сайту
        if: steps.key.outputs.ok == '1'
        run: mkdir dist && cp index.html sw.js manifest.webmanifest *.png dist/

      - name: Публікація
        if: steps.key.outputs.ok == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.key.outputs.project }}
          channelId: live
