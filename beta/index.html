<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Небо над містом · бета-каркас</title>
<link rel="icon" href="../sky-favicon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --bg:#12161c; --panel:#18202d; --panel2:#1d2737; --line:#2a3546; --text:#e7ecf3; --soft:#a9b4c4; --muted:#7c889a;
  --blue:#5aa9ff; --orange:#f2a33a; --red:#ff6b6b; --yellow:#f5c542; --green:#3ddc97;
  --r:12px; --f:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* бічна панель */
.side{position:sticky;top:0;height:100vh;background:#0f141b;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--soft);text-decoration:none;font-weight:600}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--panel)}
.nav a.on{background:var(--panel2);color:var(--text)}
.nav a .wip{margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
/* верхня панель */
.main{min-width:0}
.top{position:sticky;top:0;z-index:500;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:rgba(18,22,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;margin-right:auto}
.fresh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.g{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.18)}
.dot.y{background:var(--yellow)} .dot.r{background:var(--red)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--text)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
/* фільтр періоду */
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 24px 0}
.period .lab{font-size:13px;color:var(--muted);margin-right:4px}
.period input[type=date]{font:inherit;font-size:13px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color-scheme:dark}
.note{font-size:12px;color:var(--muted);padding:6px 24px 0}
.content{padding:18px 24px 40px}
/* картки */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h2{font-size:16px;margin:0 0 4px}
.card .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.kpi{cursor:pointer;text-decoration:none;color:inherit;display:block;transition:border-color .15s}
.kpi:hover{border-color:var(--blue)}
.kpi .lab{font-size:13px;color:var(--soft)}
.kpi .val{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .cmp{font-size:13px;color:var(--muted)}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--muted)}
.kpi.dead .val{color:var(--red)} .kpi.inj .val{color:var(--yellow)}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cardhead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;flex-wrap:wrap}
#map,#bigmap{height:420px;border-radius:10px;overflow:hidden;background:#0d1117}
#bigmap{height:calc(100vh - 210px);min-height:420px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:-1px}
.legend i.big{width:18px;height:18px;vertical-align:-4px}
/* маркери */
.mk{display:grid;place-items:center;border-radius:50%;background:rgba(242,163,58,.9);color:#1a1205;font-weight:800;font-size:12px;border:2px solid rgba(255,255,255,.85);animation:pop .35s ease-out both}
.mk.cl{background:rgba(90,169,255,.92);color:#06121f}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--text)}
.leaflet-popup-content{margin:12px 14px;font:13px/1.45 var(--f)}
.pc b{font-size:15px}
.pc .r{display:flex;justify-content:space-between;gap:16px;color:var(--soft)}
.pc .r span:last-child{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:inline-block;border:1px solid var(--blue);color:var(--blue);background:transparent;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer}
.btn.fill{background:var(--blue);color:#06121f}
/* графік */
.chart{position:relative}
.chart svg{display:block;width:100%;height:220px}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.bar{fill:var(--orange);transition:opacity .1s}
.bar.dim{opacity:.45}
.axis{fill:var(--muted);font-size:11px}
.gridl{stroke:var(--line);stroke-width:1}
/* таблиці */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.scroll{max-height:420px;overflow:auto}
/* стрічка */
.feed .it{padding:10px 0;border-bottom:1px solid var(--line)}
.feed .it:last-child{border-bottom:0}
.it .h{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:baseline;font-size:13px}
.it .when{color:var(--muted);font-variant-numeric:tabular-nums}
.it .city{font-weight:800;font-size:15px;color:var(--text);text-decoration:none}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--soft)}
.tag.cat{color:var(--orange);border-color:rgba(242,163,58,.4)}
.tag.ok{color:var(--green);border-color:rgba(61,220,151,.4)}
.tag.two{color:var(--blue);border-color:rgba(90,169,255,.4)}
.tag.one{color:var(--yellow);border-color:rgba(245,197,66,.4)}
.it .x{font-size:13px;color:var(--soft);margin-top:4px;overflow-wrap:anywhere}
.it .cas{font-size:12px;color:var(--red);font-weight:700}
.it .src{margin-left:auto;font-size:12px}
/* заглушки */
.wipbox{max-width:760px}
.wipbox .badge{display:inline-block;font-size:12px;font-weight:800;color:var(--yellow);border:1px solid rgba(245,197,66,.4);border-radius:8px;padding:3px 9px;margin-bottom:10px}
.wipbox ul{margin:8px 0 0;padding-left:20px;color:var(--soft)}
.wipbox li{margin:4px 0}
.state{padding:28px;text-align:center;color:var(--soft)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--red)}
.analytics-only{display:none}
body.an .analytics-only{display:revert}
/* модальне вікно */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(5,8,12,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,100%)}
.modal h3{margin:0 0 12px}
.modal label{display:block;font-size:13px;color:var(--soft);margin:12px 0 6px}
.modal input,.modal select{width:100%;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* мобільна навігація */
.bnav{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 14px}
  .top h1{font-size:17px;width:100%}
  .period,.note{padding-left:14px;padding-right:14px}
  .content{padding:14px 14px 90px}
  .kpi .val{font-size:26px}
  #map{height:320px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#0f141b;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);text-decoration:none;padding:4px 0}
  .bnav a svg{width:22px;height:22px}
  .bnav a.on{color:var(--blue)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Головне меню">
    <div class="brand"><img src="../sky-192.png" alt=""><div><b>Небо над містом</b><span>бета-каркас</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Тестова версія нової структури. Основний застосунок не змінено: <a href="../">nebo-nad-mistom.pp.ua</a></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title">Головна</h1>
      <div class="fresh" id="fresh" title="Час останнього оновлення даних"><span class="dot"></span><span>Завантаження…</span></div>
      <div class="seg" role="group" aria-label="Режим"><button type="button" data-m="public">Public</button><button type="button" data-m="an">Analytics</button></div>
      <button type="button" class="icon-btn" id="setBtn" aria-label="Налаштування"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div class="period" id="period" hidden></div>
    <div class="note" id="pnote" hidden></div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="Меню"></nav>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box" id="mbox"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function () {
'use strict';
const SRCS = ['https://45-32-159-93.sslip.io/events.json', 'https://raw.githubusercontent.com/ugi-analytics/rating/data/events.json'];
const OFFICIAL = new Set(["andriysadovyi", "bondarenko_mayor", "borys_filatovv", "cherkaskaoda", "chernigivskaoda", "chernivetskaoda", "dnipropetrovskaoda", "igopolishchuk", "ihor_terekhov", "ivan_fedorov_zp", "kateryna_yamshchykova", "khmelnytskaoda", "kirovohradskaoda", "klichuk_roman", "kozytskyy_maksym_official", "kr_rada", "kyivoda", "luhanskavtsa", "martsinkiv", "mykolaivskaoda", "nadal_sergii", "odeskaoda", "oleksandrkoval_rv", "olexandrprokudin", "onyshchuksvitlana", "poltavskaova", "s_morgunov", "senkevichonline", "shakyrzian_viktor", "sumy_news_oda", "symchyshyn_oleksandr", "synegubov", "ternopilskaoda", "va_kyiv", "vadymfilashkin", "vilkul", "vinnytskaoda", "vitalii_maletskyi", "vitaliy_klitschko", "volynskaoda", "zakarpatskaoda", "zhytomyrskaoda"]);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const fmt = n => Number(n || 0).toLocaleString('uk-UA');
const pad = n => String(n).padStart(2, '0');
const isoD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const kyivNow = () => { const s = new Date().toLocaleString('sv-SE', { timeZone: 'Europe/Kyiv' }); return new Date(s.replace(' ', 'T')); };
const addD = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return isoD(d); };
const dfmt = s => { const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };

// ---------- іконки й меню ----------
const IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  an: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  city: '<path d="M3 21V9l6-3v15M9 21V3l12 5v13M13 10h4M13 14h4M13 18h4"/>',
  arch: '<path d="M3 4h18v4H3zM5 8v12h14V8M10 12h4"/>',
  rep: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/>'
};
const PAGES = [
  { id: 'home', t: 'Головна', ic: 'home' },
  { id: 'map', t: 'Інтерактивна карта', s: 'Карта', ic: 'map' },
  { id: 'analytics', t: 'Аналітика', ic: 'an', wip: 1 },
  { id: 'cities', t: 'Міста', ic: 'city', wip: 1 },
  { id: 'archive', t: 'Архів подій', s: 'Архів', ic: 'arch', wip: 1 },
  { id: 'reports', t: 'Звіти', ic: 'rep', wip: 1 }
];
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
$('nav').innerHTML = PAGES.map(p => `<a href="#/${p.id}" data-p="${p.id}">${svg(p.ic)}${p.t}${p.wip ? '<span class="wip">скоро</span>' : ''}</a>`).join('');
$('bnav').innerHTML = PAGES.map(p => `<a href="#/${p.id}" data-p="${p.id}">${svg(p.ic)}${p.s || p.t}</a>`).join('');

// ---------- спільний стан (синхронізується між сторінками) ----------
const S = {
  period: ls.get('nb_period', '30d'), from: ls.get('nb_from', ''), to: ls.get('nb_to', ''),
  mode: ls.get('nb_mode', 'public'), my: ls.get('nb_my', ls.get('rv_city', '')), J: null, err: null
};
const PERIODS = [['24h', 'Остання доба'], ['7d', '7 днів'], ['30d', '30 днів'], ['cm', 'Цей місяць'], ['pm', 'Минулий місяць'], ['all', 'Весь період'], ['custom', 'Свій інтервал']];

function setMode(m) {
  S.mode = m; ls.set('nb_mode', m);
  document.body.classList.toggle('an', m === 'an');
  document.querySelectorAll('.seg [data-m]').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
}
document.querySelectorAll('.seg [data-m]').forEach(b => b.onclick = () => { setMode(b.dataset.m); route(); });
setMode(S.mode);

// ---------- єдина методика підрахунку ----------
// Подія = місто × доба (кілька повідомлень про одне місто за добу — одна подія, як в основному застосунку).
// Наслідки: за кожну подію береться найбільше назване число з повідомлень, де згадано лише це місто; потім суми.
function buildIncidents(J) {
  const perMsg = {};
  J.events.forEach(e => { const k = e.ch + '/' + e.id; perMsg[k] = (perMsg[k] || 0) + 1; });
  const map = new Map();
  J.events.forEach(e => {
    const day = e.t.slice(0, 10), key = e.c + '|' + day;
    let it = map.get(key);
    if (!it) { it = { city: e.c, day, t: e.t, msgs: [], k: 0, i: 0, ch: new Set() }; map.set(key, it); }
    it.msgs.push(e); it.ch.add(e.ch);
    if (e.t < it.t) it.t = e.t;
    if (perMsg[e.ch + '/' + e.id] === 1) { it.k = Math.max(it.k, e.k || 0); it.i = Math.max(it.i, e.i || 0); }
  });
  const list = [...map.values()];
  list.forEach(it => {
    it.msgs.sort((a, b) => a.t.localeCompare(b.t));
    const off = [...it.ch].some(c => OFFICIAL.has(c.toLowerCase()));
    it.status = off ? 'ok' : it.ch.size > 1 ? 'two' : 'one';
    it.region = (J.cities[it.city] || {}).r || '';
  });
  list.sort((a, b) => b.t.localeCompare(a.t));
  return list;
}
const STATUS = { ok: ['Офіційне джерело', 'ok'], two: ['Кілька джерел', 'two'], one: ['Одне джерело', 'one'] };

function range(p) {           // [від, до] включно, дати за Києвом
  const today = isoD(kyivNow());
  const first = S.inc && S.inc.length ? S.inc[S.inc.length - 1].day : today;
  switch (p || S.period) {
    case '24h': { const r = [addD(today, -1), today, 'останню добу']; r.t0 = Date.now() - 864e5; r.t1 = Infinity; return r; }
    case '7d': return [addD(today, -6), today, '7 днів'];
    case '30d': return [addD(today, -29), today, '30 днів'];
    case 'cm': return [today.slice(0, 8) + '01', today, 'цей місяць'];
    case 'pm': { const d = new Date(today.slice(0, 8) + '01T12:00'); d.setDate(0); const e = isoD(d); return [e.slice(0, 8) + '01', e, 'минулий місяць']; }
    case 'all': return [first, today, 'весь період'];
    case 'custom': return [S.from || addD(today, -29), S.to || today, 'свій інтервал'];
  }
}
function prevRange([a, b]) {  // попередній період такої самої довжини
  if (arguments[0].t0) { const r = [addD(a, -1), addD(b, -1)]; r.t0 = arguments[0].t0 - 864e5; r.t1 = arguments[0].t0; return r; }
  const n = Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5) + 1;
  return [addD(a, -n), addD(a, -1)];
}
const inR = (it, R) => R.t0 ? it.msgs.some(m => { const x = Date.parse(m.t); return x >= R.t0 && x < R.t1; }) : it.day >= R[0] && it.day <= R[1];
function agg(list) {
  const cities = new Set(), days = new Set(); let k = 0, i = 0;
  list.forEach(it => { cities.add(it.city); days.add(it.day); k += it.k; i += it.i; });
  return { n: list.length, cities: cities.size, days: days.size, k, i };
}
function change(cur, prev) {  // коректно для нульової бази
  if (!prev && !cur) return { txt: 'без змін', cls: 'flat' };
  if (!prev) return { txt: `+${fmt(cur)} (раніше не було)`, cls: 'up' };
  const d = cur - prev, p = Math.round(d / prev * 100);
  if (!d) return { txt: 'без змін', cls: 'flat' };
  return { txt: `${d > 0 ? '+' : ''}${fmt(d)} (${p > 0 ? '+' : ''}${p}%)`, cls: d > 0 ? 'up' : 'down' };
}

// ---------- завантаження даних ----------
async function load() {
  for (const src of SRCS) {
    try {
      const r = await fetch(src + '?t=' + Math.floor(Date.now() / 30000), { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      if (!j || !Array.isArray(j.events)) continue;
      if (!S.J || j.updated !== S.J.updated) { S.J = j; S.inc = buildIncidents(j); S.err = null; fresh(); route(); }
      return;
    } catch (e) { /* наступне джерело */ }
  }
  if (!S.J) { S.err = 'Не вдалося завантажити дані. Перевірте інтернет і оновіть сторінку.'; route(); }
}
function fresh() {
  const el = $('fresh'); if (!S.J) return;
  const age = (Date.now() - Date.parse(S.J.updated)) / 60000;
  const u = new Date(S.J.updated).toLocaleString('uk-UA', { timeZone: 'Europe/Kyiv', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const [c, t] = age < 5 ? ['g', 'Дані актуальні'] : age < 30 ? ['y', 'Оновлено ' + Math.round(age) + ' хв тому'] : ['r', 'Дані застаріли'];
  el.innerHTML = `<span class="dot ${c}"></span><span>${t} · ${u}</span>`;
}
setInterval(fresh, 30000);
setInterval(() => { if (!document.hidden) load(); }, 60000);

    (S.period === 'custom' ? ` <input type="date" id="pf" value="${range()[0]}"> — <input type="date" id="pt" value="${range()[1]}">` : '');

  if ($('pf')) { $('pf').onchange = e => { S.from = e.target.value; ls.set('nb_from', S.from); route(); }; $('pt').onchange = e => { S.to = e.target.value; ls.set('nb_to', S.to); route(); }; }

}

// ---------- графік (SVG, з підказками і таблицею значень) ----------
function barChart(el, rows, label) {
  if (!rows.length) { el.innerHTML = '<div class="state">Немає даних за вибраний період.</div>'; return; }
  const W = 800, H = 220, P = { l: 34, r: 8, t: 10, b: 26 };
  const max = Math.max(1, ...rows.map(r => r.v)), bw = (W - P.l - P.r) / rows.length;
  const y = v => H - P.b - (H - P.t - P.b) * v / max;
  const step = Math.max(1, Math.ceil(rows.length / 10));
  const ticks = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  let s = ticks.map(v => `<line class="gridl" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  rows.forEach((r, i) => {
    const x = P.l + i * bw, h = H - P.b - y(r.v);
    s += `<rect class="bar" data-i="${i}" x="${x + bw * .12}" y="${y(r.v)}" width="${Math.max(1, bw * .76)}" height="${Math.max(r.v ? 2 : 0, h)}" rx="${Math.min(4, bw * .3)}"/>`;
    if (i % step === 0) s += `<text class="axis" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(r.short)}</text>`;
    s += `<rect data-i="${i}" x="${x}" y="${P.t}" width="${bw}" height="${H - P.t - P.b}" fill="transparent"/>`;
  });
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${s}</svg><div class="tip"></div></div>
    <details class="analytics-only" style="margin-top:8px"><summary style="cursor:pointer;color:var(--soft);font-size:13px">Вихідні значення</summary><div class="scroll" style="max-height:220px"><table><tr><th>Період</th><th class="n">Подій</th></tr>${rows.map(r => `<tr><td>${esc(r.long)}</td><td class="n">${r.v}</td></tr>`).join('')}</table></div></details>`;
  const svgEl = el.querySelector('svg'), tip = el.querySelector('.tip'), bars = [...el.querySelectorAll('.bar')];
  svgEl.addEventListener('mousemove', e => {
    const t = e.target.closest('[data-i]'); if (!t) { tip.style.display = 'none'; bars.forEach(b => b.classList.remove('dim')); return; }
    const i = +t.dataset.i, r = rows[i];
    bars.forEach(b => b.classList.toggle('dim', +b.dataset.i !== i));
    const box = svgEl.getBoundingClientRect(), bb = bars[i].getBoundingClientRect();
    tip.style.display = 'block'; tip.style.left = (bb.left - box.left + bb.width / 2) + 'px'; tip.style.top = (bb.top - box.top) + 'px';
    tip.innerHTML = `<b>${esc(r.long)}</b>: ${r.v} ${r.v % 10 === 1 && r.v % 100 !== 11 ? 'подія' : 'подій'}`;
  });
  svgEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; bars.forEach(b => b.classList.remove('dim')); });
}
function series(list, [a, b], gran) {
  const cnt = {}; list.forEach(it => { const k = keyOf(it.day, gran); cnt[k] = (cnt[k] || 0) + 1; });
  const out = []; let d = a; const seen = new Set();
  while (d <= b) { const k = keyOf(d, gran); if (!seen.has(k)) { seen.add(k); out.push({ k, v: cnt[k] || 0, ...lab(k, gran) }); } d = addD(d, 1); }
  return out;
}
function keyOf(day, g) {
  if (g === 'm') return day.slice(0, 7);
  if (g === 'w') { const d = new Date(day + 'T12:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoD(d); }
  return day;
}
const MON = ['січ', 'лют', 'бер', 'кві', 'тра', 'чер', 'лип', 'сер', 'вер', 'жов', 'лис', 'гру'];
function lab(k, g) {
  if (g === 'm') { const [y, m] = k.split('-'); return { short: MON[m - 1], long: MON[m - 1] + ' ' + y }; }
  if (g === 'w') return { short: k.slice(8) + '.' + k.slice(5, 7), long: 'тиждень з ' + dfmt(k) };
  return { short: k.slice(8) + '.' + k.slice(5, 7), long: dfmt(k) };
}

// ---------- карта ----------
let mapObj = null;
function drawMap(id, list, compact) {
  if (mapObj) { mapObj.remove(); mapObj = null; }
  const el = $(id); if (!el || !window.L) { if (el) el.innerHTML = '<div class="state">Карта не завантажилась (немає доступу до бібліотеки карт).</div>'; return; }
  const m = L.map(el, { zoomControl: true, attributionControl: true, preferCanvas: true }).setView([48.6, 31.2], compact ? 5 : 6);
  const esri = s => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
  L.tileLayer(esri('Canvas/World_Dark_Gray_Base'), { maxZoom: 12, attribution: '&copy; Esri' }).addTo(m);
  L.tileLayer(esri('Canvas/World_Dark_Gray_Reference'), { maxZoom: 12 }).addTo(m);
  const by = {}; list.forEach(it => { (by[it.city] = by[it.city] || []).push(it); });
  const cl = L.markerClusterGroup({
    maxClusterRadius: 46, showCoverageOnHover: false,
    iconCreateFunction: c => { const n = c.getAllChildMarkers().reduce((s, mk) => s + mk.options.n, 0); const d = 30 + Math.min(26, Math.sqrt(n) * 3); return L.divIcon({ html: `<div class="mk cl" style="width:${d}px;height:${d}px">${n}</div>`, className: '', iconSize: [d, d] }); }
  });
  Object.entries(by).forEach(([c, its]) => {
    const ci = S.J.cities[c]; if (!ci || ci.lat == null) return;
    const n = its.length, d = 22 + Math.min(24, Math.sqrt(n) * 4), a = agg(its);
    const mk = L.marker([ci.lat, ci.lon], { n, icon: L.divIcon({ html: `<div class="mk" style="width:${d}px;height:${d}px">${n}</div>`, className: '', iconSize: [d, d] }) });
    const last = its.reduce((x, y) => x.t > y.t ? x : y);
    mk.bindPopup(`<div class="pc"><b>${esc(c)}</b><div style="color:var(--muted);margin-bottom:6px">${esc(ci.r || '')}</div>
      <div class="r"><span>Подій за період</span><span>${n}</span></div><div class="r"><span>Днів із подіями</span><span>${a.days}</span></div>
      <div class="r"><span>Загиблі</span><span>${a.k}</span></div><div class="r"><span>Поранені</span><span>${a.i}</span></div>
      <div class="r"><span>Остання подія</span><span>${dfmt(last.day)}</span></div>
      <div style="margin-top:10px"><a class="btn" href="#/city/${encodeURIComponent(c)}">Профіль міста</a></div></div>`);
    cl.addLayer(mk);
  });
  m.addLayer(cl);
  mapObj = m;
  setTimeout(() => m.invalidateSize(), 50);
}

function feedHtml(list) {

  return list.map(it => {
    const m = it.msgs[0], st = STATUS[it.status];

    const x = (m.x || '').replace(/\s+/g, ' ');
    return `<div class="it"><div class="h"><span class="when">${dfmt(it.day)} ${it.t.slice(11, 16)}</span><a class="city" href="#/city/${encodeURIComponent(it.city)}">${esc(it.city)}</a>

      <a class="src" href="https://t.me/${encodeURIComponent(m.ch)}/${m.id}" target="_blank" rel="noopener">@${esc(m.ch)} ↗</a></div>

      <div class="x analytics-only">Повідомлень про цю подію: ${it.msgs.length}, каналів: ${it.ch.size}</div></div>`;
  }).join('');
}

  analytics: ['Аналітика', ['Порівняння кількох міст (таблиці, стовпчикові й лінійні графіки)', 'Порівняння двох періодів з коректною зміною у відсотках', 'Календар інтенсивності (activity heatmap) з переходом до подій дня', 'Розподіл за днями тижня й годинами — лише там, де час відомий', 'Наслідки: підтверджені, попередні й оцінні цифри окремо, без подвійного підрахунку', 'Рейтинги міст за подіями, днями, загиблими, пораненими й динамікою']],
  cities: ['Міста', ['Каталог усіх міст з пошуком і фільтром за областю', 'Сортування за подіями, постраждалими й алфавітом', 'Повний профіль міста: графіки, календар, категорії, історія', 'PDF-звіт по місту']],
  archive: ['Архів подій', ['Таблиця всіх подій з 24.02.2022 (дані вже збираються на сервері)', 'Одночасні фільтри: текст, місто, область, дата, категорія, статус', 'Картка події: усі джерела, історія змін, статус перевірки', 'Експорт у CSV, XLSX і PDF, посилання на окрему подію']],
  reports: ['Звіти', ['Конструктор: період, міста, область, категорії, показники', 'PDF зі структурою: титул, статистика, динаміка, порівняння, рейтинг, перелік, джерела, методологія', 'Попередній перегляд, експорт таблиць в Excel', 'Збереження налаштувань і повторне формування']]
};
function pageWip(id) {
  periodBar(false);
  const [t, items] = WIP[id];
  $('view').innerHTML = `<section class="card wipbox"><span class="badge">У розробці</span><h2>${t}</h2>
    <p class="sub">Цей розділ ще не працює. Після погодження каркаса тут буде:</p><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
    <p class="sub" style="margin-top:14px">Усі розділи використовуватимуть ті самі дані й ту саму методику підрахунку, що й «Головна».</p></section>`;
}

// ---------- налаштування ----------
$('setBtn').onclick = () => {
  const cities = S.J ? Object.keys(S.J.cities).sort((a, b) => a.localeCompare(b, 'uk')) : [];
  $('mbox').innerHTML = `<h3 id="mTitle">Налаштування</h3>
    <label for="sMy">Моє місто</label><input id="sMy" list="sMyL" value="${esc(S.my)}" placeholder="Почніть вводити назву"><datalist id="sMyL">${cities.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <label for="sPer">Період за замовчуванням</label><select id="sPer">${PERIODS.filter(p => p[0] !== 'custom').map(([k, t]) => `<option value="${k}"${k === S.period ? ' selected' : ''}>${t}</option>`).join('')}</select>
    <div class="btns">${S.my ? '<button type="button" class="btn" id="sGo">Відкрити моє місто</button>' : ''}<button type="button" class="btn" id="sCancel">Скасувати</button><button type="button" class="btn fill" id="sSave">Зберегти</button></div>`;
  $('modal').classList.add('open');
  const close = () => $('modal').classList.remove('open');
  $('sCancel').onclick = close;
  $('sSave').onclick = () => { const v = $('sMy').value.trim(); S.my = S.J && S.J.cities[v] ? v : ''; ls.set('nb_my', S.my); S.period = $('sPer').value; ls.set('nb_period', S.period); close(); route(); };
  if ($('sGo')) $('sGo').onclick = () => { close(); location.hash = '#/city/' + encodeURIComponent(S.my); };
};
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').classList.remove('open'); });

// ---------- маршрутизація ----------
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'home';
  const [p, arg] = h.split('/');
  const page = p === 'city' ? 'cities' : (PAGES.find(x => x.id === p) ? p : 'home');
  document.querySelectorAll('[data-p]').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  const pg = PAGES.find(x => x.id === page);
  $('title').textContent = p === 'city' ? 'Профіль міста' : pg.t;
  document.title = $('title').textContent + ' · Небо над містом (бета)';
  if (mapObj && p !== 'home' && p !== 'map') { mapObj.remove(); mapObj = null; }
  if (p === 'city' && arg) return pageCity(arg);
  if (page === 'home') return pageHome();
  if (page === 'map') return pageMap();
  return pageWip(page);
}
addEventListener('hashchange', () => { route(); $('view').focus({ preventScroll: true }); scrollTo(0, 0); });
route();
load();
})();
</script>
</body>
</html>
