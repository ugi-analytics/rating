<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Небо над містом · бета</title>
<link rel="icon" href="../sky-favicon-32.png">
<script>
// тема застосовується до першого малювання, щоб не було «спалаху»
(function () { try { var t = localStorage.getItem('nb_theme') || 'dark', fs = localStorage.getItem('nb_fs') || 'md';
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; document.documentElement.dataset.fs = fs; } catch (e) {} })();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
/* палітра основного застосунку */
:root{
  --page:#0e1217; --surface-1:#161b22; --surface-2:#1d232c; --border:#29313c; --grid:#222934;
  --text-primary:#e8ecf1; --text-secondary:#a3adba; --text-muted:#6f7b8a;
  --accent:#ff7a2f; --accent-soft:#3a2416; --killed:#ff5d5d; --injured:#f2b544; --live:#3ddc84; --blue:#5aa9ff;
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif; --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --side:#0b0f14; color-scheme:dark;
}
[data-theme=light]{
  --page:#f6f7f9; --surface-1:#ffffff; --surface-2:#f0f2f5; --border:#dfe3e8; --grid:#eceff3;
  --text-primary:#11161d; --text-secondary:#4b5563; --text-muted:#7b8594;
  --accent:#e2611a; --accent-soft:#fde7da; --killed:#c62828; --injured:#b7791f; --live:#1a9e5a; --blue:#2a78d6;
  --side:#ffffff; color-scheme:light;
}
[data-theme=slate]{
  --page:#12161c; --surface-1:#18202d; --surface-2:#1d2737; --border:#2a3546; --grid:#232c3a;
  --text-primary:#e7ecf3; --text-secondary:#a9b4c4; --text-muted:#7c889a;
  --accent:#f2a33a; --accent-soft:#3a2b14; --killed:#ff6b6b; --injured:#f5c542; --live:#3ddc97; --blue:#5aa9ff;
  --side:#0f141b; color-scheme:dark;
}
[data-theme=soft]{
  --page:#e7eaee; --surface-1:#f3f4f6; --surface-2:#e9ecf0; --border:#d3d8de; --grid:#dde1e6;
  --text-primary:#1a2029; --text-secondary:#4a5361; --text-muted:#78818e;
  --accent:#d9601c; --accent-soft:#f7e2d4; --killed:#c62828; --injured:#a96f12; --live:#1a8f52; --blue:#2a6fc4;
  --side:#eef0f3; color-scheme:light;
}
html{font-size:15px} html[data-fs=lg]{font-size:17px} html[data-fs=sm]{font-size:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-primary);font:1rem/1.45 var(--f-body)}
a{color:var(--blue)} button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{display:block;font:700 15px/1.15 var(--f-display)}
.brand span{font-size:12px;color:var(--text-muted)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text-secondary);text-decoration:none;font-weight:700}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--surface-1)}
.nav a.on{background:var(--surface-2);color:var(--text-primary)}
.nav a.on svg{color:var(--accent)}
.nav .wip{margin-left:auto;font-size:10px;color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:1px 5px}
.side .foot{margin-top:auto;font-size:12px;color:var(--text-muted);padding:8px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:1100;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top h1{font:700 19px/1.2 var(--f-display);margin:0 auto 0 0}
.fresh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text-muted);flex:none}
.dot.g{background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 25%,transparent)}
.dot.y{background:var(--injured)} .dot.r{background:var(--killed)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:700;color:var(--text-secondary);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--border)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-1);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 24px 0}
.period .lab{font-size:13px;color:var(--text-muted)}
.inp{background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px}
.note{font-size:12px;color:var(--text-muted);padding:6px 24px 0}
.content{padding:18px 24px 40px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-width:0}
.card h2{font:700 15px/1.3 var(--f-display);margin:0 0 4px}
.card .sub{font-size:13px;color:var(--text-muted);margin:0 0 12px}
.kpi{text-decoration:none;color:inherit;display:block}
a.kpi:hover{border-color:var(--accent)}
.kpi .lab{font-size:13px;color:var(--text-secondary)}
.kpi .val{font:700 30px/1.15 var(--f-display);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi .cmp{font-size:13px;color:var(--text-muted)}
.up{color:var(--killed)} .down{color:var(--live)} .flat{color:var(--text-muted)}
.kpi.dead .val{color:var(--killed)} .kpi.inj .val{color:var(--injured)} .kpi.acc .val{color:var(--accent)}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cardhead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;flex-wrap:wrap}
.mapbox{height:420px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
#bigmap{height:calc(100vh - 250px);min-height:420px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:-1px}
.mk{display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#1a0d04;font:800 12px var(--f-body);border:2px solid rgba(255,255,255,.85);animation:pop .35s ease-out both}
.mk.cl{background:var(--blue);color:#fff}
.mk.me{background:#fff;border-color:var(--blue);color:var(--blue)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface-2);color:var(--text-primary)}
.leaflet-popup-content{margin:12px 14px;font:13px/1.45 var(--f-body)}
.pc b{font-size:15px}
.pc .r{display:flex;justify-content:space-between;gap:16px;color:var(--text-secondary)}
.pc .r span:last-child{color:var(--text-primary);font-weight:700}
.btn{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer}
.btn.fill{background:var(--accent);color:#fff}
.chart{position:relative}
.chart svg{display:block;width:100%;height:220px}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5}
.bar{fill:var(--accent)} .bar.dim{opacity:.4}
.axis{fill:var(--text-muted);font-size:11px} .gridl{stroke:var(--grid)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--text-muted);font-weight:700;font-size:12px;border-bottom:1px solid var(--border);padding:6px 8px}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.scroll{max-height:440px;overflow:auto}
/* шапка Головної з нічною картою (як в основному застосунку) */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--border);background:#0b0f14;padding:22px 22px 18px;margin-bottom:16px;isolation:isolate}
[data-theme=light] .hero{background:#10161f}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero h2{font:700 24px/1.2 var(--f-display);margin:0 0 6px;color:#e8ecf1;max-width:560px}
.hero .lead{color:#a3adba;font-size:14px;margin:0 0 150px;max-width:520px}
.hero .kpis .card{background:rgba(22,27,34,.72);backdrop-filter:blur(3px);border-color:rgba(255,255,255,.09);color:#e8ecf1}
.hero .kpis .lab{color:#a3adba} .hero .kpis .cmp{color:#8792a2}
.hero .kpis .kpi.dead .val{color:#ff5d5d} .hero .kpis .kpi.inj .val{color:#f2b544} .hero .kpis .kpi.acc .val{color:#ff7a2f}
.hero .kpis .up{color:#ff8a7a} .hero .kpis .down{color:#3ddc84}
.hero .eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#ff9a5c;margin-bottom:6px}
.hero .chg{font:inherit;font-size:13px;color:#9cc8ff;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.now{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(22,27,34,.72);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px 14px;color:#e8ecf1;margin:0 0 14px;max-width:640px;backdrop-filter:blur(3px)}
.now .big{font:700 20px var(--f-display)}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 120px}
.pick .inp{background:rgba(22,27,34,.85);color:#e8ecf1;border-color:rgba(255,255,255,.15);min-width:220px}
.sect{font:700 13px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:22px 0 10px}
@media (max-width:820px){.hero{padding:16px}.hero h2{font-size:18px}.hero .lead{margin-bottom:110px}}
/* календар архіву */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:460px}
.cal .h{font-size:11px;color:var(--text-muted);text-align:center}
.cal button{font:600 12px var(--f-body);aspect-ratio:1.35;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--text-secondary);cursor:pointer;padding:0}
.cal button.l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface-2));color:var(--text-primary)}
.cal button.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface-2));color:var(--text-primary)}
.cal button.l3{background:var(--accent);color:#fff;font-weight:800}
.cal button.sel{outline:2px solid var(--text-primary);outline-offset:1px}
.cal button:disabled{opacity:.3;cursor:default}
.calhead{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.navb{width:32px;height:30px;border:1px solid var(--border);border-radius:8px;background:var(--surface-1);cursor:pointer}
.navb:disabled{opacity:.35;cursor:default}
.archgrid{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.archgrid{grid-template-columns:1fr}}
.cmpchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmpchips .chip b{margin-left:6px;color:var(--text-muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
/* пости */
.feed .it{padding:11px 0;border-bottom:1px solid var(--border)}
.feed .it:last-child{border-bottom:0}
.it .h{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13px}
.it .when{color:var(--text-muted);font-variant-numeric:tabular-nums}
.it .city{font-weight:800;font-size:15px;color:var(--text-primary);text-decoration:none}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;border:1px solid var(--border);color:var(--text-secondary)}
.tag.cat{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tag.ok{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent)}
.tag.two{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.tag.one{color:var(--injured);border-color:color-mix(in srgb,var(--injured) 45%,transparent)}
.tag.k-bal,.tag.k-rkt{color:var(--killed);border-color:color-mix(in srgb,var(--killed) 45%,transparent)}
.tag.k-kab{color:#b58cff;border-color:#b58cff66}
.tag.k-jet,.tag.k-fast{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tag.k-uav{color:var(--injured);border-color:color-mix(in srgb,var(--injured) 45%,transparent)}
.it .x{font-size:13px;color:var(--text-secondary);margin-top:4px;overflow-wrap:anywhere}
.it .cas{font-size:12px;color:var(--killed);font-weight:800}
.it .dist{font-size:12px;color:var(--text-muted)}
.it .src{margin-left:auto;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface-1);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-secondary)}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--text-primary);background:var(--accent-soft)}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cc{display:block;text-decoration:none;color:inherit;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.cc:hover{border-color:var(--accent)}
.cc b{font-size:15px} .cc .rg{font-size:12px;color:var(--text-muted)}
.cc .nums{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--text-secondary)}
.cc .nums span b{font-size:15px;color:var(--text-primary)}
.wipbox .badge{display:inline-block;font-size:12px;font-weight:800;color:var(--injured);border:1px solid color-mix(in srgb,var(--injured) 45%,transparent);border-radius:8px;padding:3px 9px;margin-bottom:10px}
.wipbox ul{margin:8px 0 0;padding-left:20px;color:var(--text-secondary)} .wipbox li{margin:4px 0}
.state{padding:28px;text-align:center;color:var(--text-secondary)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--killed)}
.modal{position:fixed;inset:0;z-index:2000;background:rgba(5,8,12,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font:700 17px var(--f-display)}
.modal label{display:block;font-size:13px;color:var(--text-secondary);margin:14px 0 6px;font-weight:700}
.modal .inp{width:100%}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.results{margin-top:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:none}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:var(--surface-1);padding:8px 12px;cursor:pointer;font-size:14px}
.results button:hover{background:var(--surface-2)} .results small{color:var(--text-muted)}
.bnav{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr} .side{display:none}
  .top{padding:10px 14px} .top h1{font-size:16px;width:100%}
  .period,.note{padding-left:14px;padding-right:14px}
  .content{padding:14px 14px 92px}
  .kpi .val{font-size:24px} .mapbox{height:320px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--side);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--text-muted);text-decoration:none;padding:4px 0}
  .bnav a svg{width:22px;height:22px} .bnav a.on{color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Головне меню">
    <div class="brand"><img src="../sky-192.png" alt=""><div><b>Небо над містом</b><span>бета нової структури</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Тестова версія. Основний застосунок не змінено: <a href="../">nebo-nad-mistom.pp.ua</a></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title">Головна</h1>
      <div class="fresh" id="fresh"><span class="dot"></span><span>Завантаження…</span></div>
      <button type="button" class="icon-btn" id="setBtn" aria-label="Налаштування"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div class="period" id="period"></div>
    <div class="note" id="pnote"></div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="Меню"></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box" id="mbox"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function () {
'use strict';

function heroMap(cv, counts, me) {
  heroState = { cv, counts };
  const ev = counts, pts = HERO_BASE.map(([n, la, lo]) => ({ n, la, lo, e: ev[n] || 0 }));
  Object.entries(ev).forEach(([n, e]) => { const c = S.J.cities[n]; if (c && c.lat != null && !pts.some(p => p.n === n)) pts.push({ n, la: c.lat, lo: c.lon, e }); });
  const max = Math.max(1, ...pts.map(p => p.e));

    if (!cv.isConnected) return;
    const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const narrow = W < 760, K = Math.cos(48.5 * Math.PI / 180), mapH = H - 20;
    // пропорції близькі до справжніх; на широкому екрані — правіше центру, під заголовком лишається місце
    let sy = mapH / (52.5 - 44.3), sx = Math.min(sy * K * 1.45, (W * 0.98) / (40.3 - 22));
    if (narrow) { sx = Math.min(sy * K, (W * 0.98) / (40.3 - 22)); sy = sx / K; }
    const mapW = (40.3 - 22) * sx, cxm = narrow ? W / 2 : Math.min(W - mapW / 2 - W * 0.01, Math.max(W * 0.58, mapW / 2)), x0 = cxm - mapW / 2, y0 = 10;
    const X = lo => x0 + (lo - 22) * sx, Y = la => y0 + (52.5 - la) * sy;
    if (GEO) {     // контури областей: м'яка заливка й тонкі межі
      g.beginPath(); GEO.forEach(r => r.forEach(([lo, la], i) => i ? g.lineTo(X(lo), Y(la)) : g.moveTo(X(lo), Y(la))));
      g.fillStyle = 'rgba(110,130,160,0.07)'; g.fill('evenodd'); g.strokeStyle = 'rgba(150,172,205,0.30)'; g.lineWidth = 1; g.lineJoin = 'round'; g.stroke();
    }
    g.strokeStyle = 'rgba(120,140,165,0.07)';     // сітка координат
    for (let lo = 22; lo <= 40; lo += 2) { g.beginPath(); g.moveTo(X(lo), 0); g.lineTo(X(lo), H); g.stroke(); }
    for (let la = 45; la <= 52; la += 1) { g.beginPath(); g.moveTo(0, Y(la)); g.lineTo(W, Y(la)); g.stroke(); }
    const r = rnd(20261116);                     // «вогні» дрібних населених пунктів
    for (let i = 0; i < 1500; i++) { const la = 44.6 + r() * 7.6, lo = 22.3 + r() * 17.7; if (la < 46.2 && !(lo > 32.5 && lo < 36.6)) continue;
      g.fillStyle = `rgba(150,170,200,${0.15 + r() * 0.35})`; g.fillRect(X(lo), Y(la), 1.2, 1.2); }
    pts.forEach(p => {                           // міста світяться за кількістю подій
      const k = Math.sqrt(p.e / max), x = X(p.lo), y = Y(p.la), R = p.e ? 10 + 46 * k : 9, gr = g.createRadialGradient(x, y, 0, x, y, R);
      if (p.e) { gr.addColorStop(0, `rgba(255,122,47,${0.25 + 0.45 * k})`); gr.addColorStop(1, 'rgba(255,122,47,0)'); } else { gr.addColorStop(0, 'rgba(140,160,190,0.22)'); gr.addColorStop(1, 'rgba(140,160,190,0)'); }
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
      g.fillStyle = p.e ? `rgba(255,${190 - 40 * k | 0},${140 - 60 * k | 0},0.95)` : 'rgba(185,198,218,0.7)'; g.beginPath(); g.arc(x, y, p.e ? 1.6 + 2.6 * k : 1.3, 0, 7); g.fill();

    if (!narrow) { const sh = g.createLinearGradient(0, 0, W * 0.55, 0); sh.addColorStop(0, 'rgba(11,15,20,0.62)'); sh.addColorStop(1, 'rgba(11,15,20,0)'); g.fillStyle = sh; g.fillRect(0, 0, W * 0.55, H); }
    const mc = me && S.J.cities[me];
    if (mc && mc.lat != null) {             // моє місто: кільце радіуса «мого регіону» і підпис
      const x = X(mc.lon), y = Y(mc.lat), rr = S.rad / 111 * sy;

const PAL = ['#3987e5', '#ff7a2f', '#199e70', '#c98500', '#d55181', '#9085e9'];
function pageAnalytics() {
  periodBar('days'); if (!guard()) return;
  const R = range(), P = prevRange(R), cur = S.inc.filter(it => inR(it, R)), prev = S.inc.filter(it => inR(it, P)), hp = hasPrevData(P);
  const byC = {}, byP = {}; cur.forEach(it => (byC[it.city] = byC[it.city] || []).push(it)); prev.forEach(it => (byP[it.city] = byP[it.city] || []).push(it));
  const top = Object.entries(byC).sort((a, b) => b[1].length - a[1].length).map(x => x[0]);
  let sel = JSON.parse(ls.get('nb_cmp', '[]')).filter(c => S.J.cities[c]);
  if (!sel.length) sel = (S.my && byC[S.my] ? [S.my] : []).concat(top.filter(c => c !== S.my)).slice(0, 3);
  const metric = ls.get('nb_rmet', 'n');
  // порівняння міст
  const total = cur.length || 1;
  const rows = sel.map((c, i) => { const a = agg(byC[c] || []), b = agg(byP[c] || []); return { c, col: PAL[i % PAL.length], a, b, share: Math.round(a.n / total * 1000) / 10 }; });
  // розподіл за днями тижня (день події)
  const DOW = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'нд'], dow = [0, 0, 0, 0, 0, 0, 0];
  cur.forEach(it => dow[(new Date(it.day + 'T12:00').getDay() + 6) % 7]++);
  // розподіл за годинами (час першого повідомлення про подію — час публікації, не час удару)
  const hrs = Array(24).fill(0); cur.forEach(it => hrs[+hm(it.t).slice(0, 2)]++);
  // рейтинги
  const MET = { n: ['подій', x => x.n], d: ['днів із подіями', x => x.days], k: ['загиблих', x => x.k], i: ['поранених', x => x.i], ch: ['зростання подій', x => x.n - x.p] };
  const rank = Object.entries(byC).map(([c, l]) => ({ c, ...agg(l), p: (byP[c] || []).length })).sort((a, b) => MET[metric][1](b) - MET[metric][1](a)).slice(0, 15);
  const cell = (v, pv) => { const ch = change(v, pv); return `<td class="n">${fmt(v)}${hp ? `<div class="${ch.cls}" style="font-size:12px">${ch.txt}</div>` : ''}</td>`; };
  $('view').innerHTML = `
    <section class="card"><div class="cardhead"><div><h2>Порівняння міст</h2><p class="sub">За ${R[2]}${hp ? ', зі зміною до попереднього такого ж періоду' : ''}</p></div></div>
      <div class="cmpchips" style="margin-bottom:12px">${rows.map(r => `<button class="chip" aria-pressed="true" data-rm="${esc(r.c)}"><span class="sw" style="background:${r.col}"></span>${esc(r.c)} ✕</button>`).join('')}
        ${sel.length < 6 ? `<input class="inp" id="addc" list="addl" placeholder="+ додати місто" style="width:170px"><datalist id="addl">${Object.keys(S.J.cities).filter(c => !sel.includes(c)).map(c => `<option value="${esc(c)}">`).join('')}</datalist>` : ''}</div>
      <div class="scroll"><table><tr><th>Місто</th><th class="n">Подій</th><th class="n">Днів із подіями</th><th class="n">Загиблі</th><th class="n">Поранені</th><th class="n">Частка всіх подій</th></tr>
      ${rows.map(r => `<tr><td><span class="sw" style="background:${r.col}"></span><a href="#/city/${encodeURIComponent(r.c)}"><b>${esc(r.c)}</b></a></td>${cell(r.a.n, r.b.n)}${cell(r.a.days, r.b.days)}${cell(r.a.k, r.b.k)}${cell(r.a.i, r.b.i)}<td class="n">${r.share}%</td></tr>`).join('')}</table></div>
      <h2 style="margin-top:16px">Динаміка по тижнях</h2><div id="cmpLines"></div></section>
    <div class="grid two" style="margin-top:16px">
      <section class="card"><h2>За днями тижня</h2><p class="sub">Скільки подій припало на кожен день тижня</p><div id="dow"></div></section>
      <section class="card"><h2>За годинами</h2><p class="sub">За часом першого повідомлення про подію (не точний час удару)</p><div id="hrs"></div></section>
    </div>
    <section class="card" style="margin-top:16px"><div class="cardhead"><div><h2>Рейтинг міст</h2><p class="sub">За ${R[2]}</p></div>
      <select class="inp" id="rmet">${Object.entries(MET).map(([k, v]) => `<option value="${k}"${k === metric ? ' selected' : ''}>За кількістю ${v[0]}</option>`).join('').replace('За кількістю зростання подій', 'За зростанням подій')}</select></div>
      ${rank.length ? `<div class="scroll"><table><tr><th>#</th><th>Місто</th><th class="n">Подій</th><th class="n">Днів</th><th class="n">Загиблі</th><th class="n">Поранені</th><th class="n">Зміна</th></tr>
      ${rank.map((r, i) => `<tr class="click" data-c="${esc(r.c)}"><td>${i + 1}</td><td><b>${esc(r.c)}</b></td><td class="n">${r.n}</td><td class="n">${r.days}</td><td class="n">${r.k || '—'}</td><td class="n">${r.i || '—'}</td><td class="n ${hp ? change(r.n, r.p).cls : 'flat'}">${hp ? (r.p ? (r.n - r.p > 0 ? '+' : '') + (r.n - r.p) : 'нове') : '—'}</td></tr>`).join('')}</table></div>` : '<div class="state">Подій немає.</div>'}</section>
    <section class="card" style="margin-top:16px"><h2>Календар інтенсивності</h2><p class="sub">Повний календар по днях — у розділі <a href="#/archive">«Архів»</a> (натисніть день, щоб побачити події).</p></section>`;
  // лінії по тижнях для вибраних міст
  const wk = series([], R, 'w').map(x => x.k);
  if (wk.length) {
    const W = 800, H = 220, Pd = { l: 34, r: 10, t: 10, b: 26 }, data = rows.map(r => { const m = {}; (byC[r.c] || []).forEach(it => { const k = keyOf(it.day, 'w'); m[k] = (m[k] || 0) + 1; }); return wk.map(k => m[k] || 0); });
    const max = Math.max(1, ...data.flat()), x = i => Pd.l + (W - Pd.l - Pd.r) * (wk.length === 1 ? .5 : i / (wk.length - 1)), y = v => H - Pd.b - (H - Pd.t - Pd.b) * v / max;
    let g = [...new Set([0, Math.round(max / 2), max])].map(v => `<line class="gridl" x1="${Pd.l}" x2="${W - Pd.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${Pd.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
    const step = Math.max(1, Math.ceil(wk.length / 8)); wk.forEach((k, i) => { if (i % step === 0) g += `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${k.slice(8)}.${k.slice(5, 7)}</text>`; });
    data.forEach((d, j) => { g += `<polyline fill="none" stroke="${rows[j].col}" stroke-width="2" points="${d.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>` + d.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${rows[j].col}" stroke="var(--surface-1)" stroke-width="2"><title>${esc(rows[j].c)}, тиждень з ${dfmt(wk[i])}: ${v}</title></circle>`).join(''); });
    $('cmpLines').innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Динаміка подій вибраних міст по тижнях">${g}</svg></div>
      <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--text-secondary);font-size:13px">Вихідні значення</summary><div class="scroll" style="max-height:240px"><table><tr><th>Тиждень з</th>${rows.map(r => `<th class="n">${esc(r.c)}</th>`).join('')}</tr>${wk.map((k, i) => `<tr><td>${dfmt(k)}</td>${data.map(d => `<td class="n">${d[i]}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
  }
  barChart($('dow'), DOW.map((d, i) => ({ v: dow[i], short: d, long: d })), 'Події за днями тижня');
  barChart($('hrs'), hrs.map((v, i) => ({ v, short: String(i), long: `${pad(i)}:00–${pad(i)}:59` })), 'Події за годинами');
  const save = l => { ls.set('nb_cmp', JSON.stringify(l)); pageAnalytics(); };
  $('view').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => save(sel.filter(c => c !== b.dataset.rm)));
  if ($('addc')) $('addc').onchange = e => { const v = e.target.value.trim(); if (S.J.cities[v] && !sel.includes(v)) save(sel.concat(v)); };
  $('rmet').onchange = e => { ls.set('nb_rmet', e.target.value); pageAnalytics(); };
  $('view').querySelectorAll('tr[data-c]').forEach(tr => tr.onclick = () => location.hash = '#/city/' + encodeURIComponent(tr.dataset.c));
}

// ---------- налаштування ----------
function settings() {
  const cities = S.J ? Object.keys(S.J.cities).sort((a, b) => a.localeCompare(b, 'uk')) : [];
  const th = ls.get('nb_theme', 'dark'), fs = ls.get('nb_fs', 'md');
  $('mbox').innerHTML = `<h3 id="mTitle">Налаштування</h3>
    <label>Тема</label><div class="seg" id="sTheme"><button type="button" data-v="dark">Темна</button><button type="button" data-v="slate">Графітова</button><button type="button" data-v="soft">М’яка світла</button><button type="button" data-v="light">Світла</button><button type="button" data-v="auto">Як у системі</button></div>
    <label>Розмір тексту</label><div class="seg" id="sFs"><button type="button" data-v="sm">Менший</button><button type="button" data-v="md">Звичайний</button><button type="button" data-v="lg">Більший</button></div>
    <label for="sMy">Моє місто</label><input class="inp" id="sMy" list="sMyL" value="${esc(S.my)}" placeholder="Почніть вводити назву"><datalist id="sMyL">${cities.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <label for="sRad">«Мій регіон» — радіус від мого міста</label><select class="inp" id="sRad">${[50, 100, 150, 200, 300].map(r => `<option value="${r}"${r === S.rad ? ' selected' : ''}>${r} км</option>`).join('')}</select>
    <label for="sPer">Період за замовчуванням</label><select class="inp" id="sPer">${PERIODS.filter(p => p[0] !== 'custom').map(([k, t]) => `<option value="${k}"${k === S.period ? ' selected' : ''}>${t}</option>`).join('')}</select>
    <div class="btns"><button type="button" class="btn" id="sCancel">Скасувати</button><button type="button" class="btn fill" id="sSave">Зберегти</button></div>`;
  const segv = (id, v) => document.querySelectorAll(`#${id} [data-v]`).forEach(b => { b.setAttribute('aria-pressed', b.dataset.v === v); b.onclick = () => { document.querySelectorAll(`#${id} [data-v]`).forEach(x => x.setAttribute('aria-pressed', x === b)); if (id === 'sTheme') { ls.set('nb_theme', b.dataset.v); } else { ls.set('nb_fs', b.dataset.v); } applyTheme(); }; });
  segv('sTheme', th); segv('sFs', fs);
  $('modal').classList.add('open');
  const close = () => $('modal').classList.remove('open');
  $('sCancel').onclick = () => { ls.set('nb_theme', th); ls.set('nb_fs', fs); applyTheme(); close(); };
  $('sSave').onclick = () => { const v = $('sMy').value.trim(); S.my = S.J && S.J.cities[v] ? v : ''; ls.set('nb_my', S.my); S.rad = +$('sRad').value; ls.set('nb_rad', S.rad); S.period = $('sPer').value; ls.set('nb_period', S.period); close(); route(); };
}
$('setBtn').onclick = settings;
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').classList.remove('open'); });

// ---------- маршрутизація ----------
function curPage() { const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'home'; return h.split('/')[0]; }
function route(soft) {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'home', [p, arg] = h.split('/');
  const page = p === 'city' ? 'cities' : (PAGES.find(x => x.id === p) ? p : 'home');
  if (soft && page === 'map') return;            // не перемальовувати карту під час пошуку
  document.querySelectorAll('[data-p]').forEach(a => a.classList.toggle('on', a.dataset.p === page));
  $('title').textContent = p === 'city' ? 'Профіль міста' : PAGES.find(x => x.id === page).t;
  document.title = $('title').textContent + ' · Небо над містом (бета)';
  if (mapObj && page !== 'home' && page !== 'map') { mapObj.remove(); mapObj = null; }
  const y = soft ? scrollY : 0;
  if (p === 'city' && arg) pageCity(arg);
  else if (page === 'home') pageHome();
  else if (page === 'threats') pageThreats();
  else if (page === 'map') pageMap();
  else if (page === 'cities') pageCities();
  else if (page === 'analytics') pageAnalytics();
  else if (page === 'archive') { if (!soft) pageArchive(); }
  else pageHome();
  if (soft) scrollTo(0, y);
}
addEventListener('hashchange', () => { route(); scrollTo(0, 0); });
route(); load();
})();
</script>
</body>
</html>
